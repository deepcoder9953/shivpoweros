    <script>
      // Global suppression for benign dev-server WebSocket disconnection/closure errors in iframe sandbox
      (function() {
        var originalConsoleError = console.error;
        console.error = function() {
          var msg = arguments[0];
          if (typeof msg === 'string' && (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('[vite] failed to connect'))) {
            return;
          }
          originalConsoleError.apply(console, arguments);
        };

        window.addEventListener('unhandledrejection', function(event) {
          var reasonStr = (event && event.reason) ? (event.reason.message || String(event.reason)) : '';
          if (reasonStr && (reasonStr.includes('WebSocket') || reasonStr.includes('websocket'))) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = event && event.message ? String(event.message) : '';
          if (msg && (msg.includes('WebSocket') || msg.includes('websocket'))) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
